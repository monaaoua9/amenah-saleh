syntax = "proto3";

package dspe.v1;

option go_package = "github.com/monaaoua9/streamdb/internal/ingest/pb";

message Event {
  string key = 1;
  double value = 2;
  int64 time = 3; // event time, unix ms
  uint64 seq = 4; // per producer, starts at 1
}

message Batch {
  string producer = 1;
  repeated Event events = 2;
}

message Ack {
  string producer = 1;
  uint64 last_seq = 2;
  // highest seq covered by a completed checkpoint: everything up to here
  // survives a crash, anything after it must be replayed by the producer
  uint64 committed_seq = 3;
}

service Ingest {
  rpc Stream(stream Batch) returns (stream Ack);
}
